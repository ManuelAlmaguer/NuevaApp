name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a construir (ej. 1.0.0)'
        required: true
        default: '0.0.1-dev'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release APK firmado
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secret SIGNING_KEYSTORE_BASE64"; exit 1
          fi
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 --decode > keys/release.jks
          cat > keystore.properties <<EOF
          storeFile=keys/release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 keys/release.jks keystore.properties

      - name: Tests unitarios (JVM / Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compilar APK release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verificar firma y contenido del APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -5
          cp "$APK" "NuevaApp-${{ github.ref_name }}.apk"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: NuevaApp-*.apk
          retention-days: 30

      - name: Publicar GitHub Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NuevaApp ${{ github.ref_name }}
          files: NuevaApp-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Limpiar material de firma
        if: always()
        run: |
          rm -f keys/release.jks keystore.properties || true